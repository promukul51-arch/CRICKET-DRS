
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gully DRS - Camera Test</title>

<style>
body {
    margin: 0;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    padding: 15px;
}

#cameraBox {
    width: 95%;
    max-width: 750px;
    margin: auto;
    background: black;
    border-radius: 15px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

button {
    margin: 15px 5px;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    background: #1976d2;
    color: white;
}

#status {
    margin: 10px auto;
    padding: 15px;
    width: 90%;
    max-width: 600px;
    background: #181818;
    border-radius: 10px;
}

#frames {
    font-size: 20px;
    margin: 15px;
}

#canvas {
    display: none;
}
</style>
</head>

<body>

<h1>🏏 Gully DRS Camera Test</h1>

<div id="cameraBox">
    <video id="camera" autoplay muted playsinline></video>
</div>

<button onclick="startCamera()">
    📷 START CAMERA
</button>

<div id="status">
    Press START CAMERA.
</div>

<div id="frames">
    Frames: 0
</div>

<canvas id="canvas"></canvas>

<script>

const camera = document.getElementById("camera");
const status = document.getElementById("status");
const framesText = document.getElementById("frames");
const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

let stream = null;
let frameCount = 0;
let running = false;


/* =========================
   START CAMERA
========================= */

async function startCamera() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "environment",
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                }
            },

            audio: false

        });

        camera.srcObject = stream;

        status.innerText =
            "✅ CAMERA WORKING";

        running = true;

        countFrames();

    }

    catch (error) {

        console.error(error);

        status.innerText =
            "❌ Camera could not start.";

    }

}


/* =========================
   COUNT VIDEO FRAMES
========================= */

function countFrames() {

    if (!running) return;

    if (camera.readyState >= 2) {

        frameCount++;

        framesText.innerText =
            "Frames: " + frameCount;

    }

    requestAnimationFrame(countFrames);

}

</script>

</body>
</html>
