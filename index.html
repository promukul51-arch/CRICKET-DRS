<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gully DRS 🏏</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 18px;
    background: #151515;
    font-size: 26px;
    font-weight: bold;
}

#cameraBox {
    position: relative;
    width: 96%;
    max-width: 700px;
    margin: 15px auto;
    overflow: hidden;
    border-radius: 15px;
    background: black;
}

#camera {
    width: 100%;
    display: block;
}

#wicket {
    position: absolute;
    border: 4px solid red;
    display: none;
    pointer-events: none;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
}

.camera {
    background: #1976d2;
    color: white;
}

.setup {
    background: #e53935;
    color: white;
}

.start {
    background: #16a34a;
    color: white;
}

.drs {
    background: #7e57c2;
    color: white;
}

.stop {
    background: #555;
    color: white;
}

#status {
    margin: 12px auto;
    padding: 13px;
    max-width: 700px;
    background: #181818;
    border-radius: 10px;
}

#decision {
    font-size: 28px;
    font-weight: bold;
    margin: 15px;
}

#drsBox {
    display: none;
    max-width: 700px;
    margin: 15px auto;
    padding: 15px;
    background: #181818;
    border-radius: 15px;
}

#replay {
    width: 100%;
    border-radius: 10px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<header>
🏏 GULLY DRS
</header>

<div id="cameraBox">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <div id="wicket"></div>

</div>

<div>

    <!-- CAMERA -->
    <button
        class="camera"
        onclick="startCamera()">
        📷 Start Camera
    </button>

    <!-- WICKET -->
    <button
        class="setup"
        onclick="setupWicket()">
        🟥 Set Wicket
    </button>

    <br>

    <!-- START UMPIRE -->
    <button
        class="start"
        onclick="startUmpire()">
        ▶️ START UMPIRE
    </button>

    <!-- STOP -->
    <button
        class="stop"
        onclick="stopUmpire()">
        ⏹ STOP
    </button>

    <br>

    <!-- DRS -->
    <button
        class="drs"
        onclick="openDRS()">
        🔍 DRS
    </button>

</div>

<div id="status">
Start the camera first.
</div>

<div id="decision">
—
</div>


<!-- DRS -->

<div id="drsBox">

    <h2>🔍 DRS REPLAY</h2>

    <video
        id="replay"
        controls>
    </video>

    <br>

    <button onclick="slowMotion()">
        🐢 Slow
    </button>

    <button onclick="normalSpeed()">
        ▶ Normal
    </button>

    <button onclick="backFrame()">
        ⏪
    </button>

    <button onclick="forwardFrame()">
        ⏩
    </button>

</div>


<script>

const camera =
    document.getElementById("camera");

const cameraBox =
    document.getElementById("cameraBox");

const wicket =
    document.getElementById("wicket");

const status =
    document.getElementById("status");

const decision =
    document.getElementById("decision");

const drsBox =
    document.getElementById("drsBox");

const replay =
    document.getElementById("replay");


let stream = null;

let recorder = null;

let chunks = [];

let lastBall = null;

let settingWicket = false;

let umpireRunning = false;

let firstPoint = null;


// =====================================
// CAMERA
// =====================================

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "environment"
                },

                audio: false

            });

        camera.srcObject = stream;

        status.innerText =
            "📷 Camera ready. Set your wall wicket.";

    }

    catch(error) {

        status.innerText =
            "❌ Camera permission denied.";

    }

}


// =====================================
// SET WICKET
// =====================================

function setupWicket() {

    if (!stream) {

        status.innerText =
            "Start the camera first.";

        return;

    }

    settingWicket = true;

    firstPoint = null;

    status.innerText =
        "Tap the TOP-LEFT corner of your wall wicket.";

}


// =====================================
// WICKET CORNERS
// =====================================

cameraBox.addEventListener(
    "click",
    function(event) {

        if (!settingWicket)
            return;


        const rect =
            cameraBox.getBoundingClientRect();


        const x =
            event.clientX - rect.left;

        const y =
            event.clientY - rect.top;


        // FIRST CORNER

        if (!firstPoint) {

            firstPoint = {
                x: x,
                y: y
            };

            status.innerText =
                "Now tap the BOTTOM-RIGHT corner.";

            return;

        }


        // SECOND CORNER

        let left =
            Math.min(firstPoint.x, x);

        let top =
            Math.min(firstPoint.y, y);

        let width =
            Math.abs(x - firstPoint.x);

        let height =
            Math.abs(y - firstPoint.y);


        wicket.style.left =
            left + "px";

        wicket.style.top =
            top + "px";

        wicket.style.width =
            width + "px";

        wicket.style.height =
            height + "px";


        wicket.style.display =
            "block";


        firstPoint = null;

        settingWicket = false;


        status.innerText =
            "✅ Wicket saved. Press START UMPIRE.";

    }
);


// =====================================
// START UMPIRE
// =====================================

function startUmpire() {

    if (!stream) {

        status.innerText =
            "Start the camera first.";

        return;

    }


    if (wicket.style.display !== "block") {

        status.innerText =
            "Set the wicket first.";

        return;

    }


    umpireRunning = true;


    status.innerText =
        "🟢 AI UMPIRE ACTIVE — Waiting for ball...";


    decision.innerText =
        "🟢 READY";


    startDelivery();

}


// =====================================
// RECORD ONE DELIVERY
// =====================================

function startDelivery() {

    if (!umpireRunning)
        return;


    chunks = [];


    recorder =
        new MediaRecorder(stream);


    recorder.ondataavailable =
        function(event) {

            if (event.data.size > 0) {

                chunks.push(event.data);

            }

        };


    recorder.onstop =
        function() {

            lastBall =
                new Blob(
                    chunks,
                    { type: "video/webm" }
                );


            decision.innerText =
                "🟢 LEGAL";


            status.innerText =
                "🏏 Ball recorded. Waiting for next ball...";


            // Wait a little before next delivery

            if (umpireRunning) {

                setTimeout(
                    startDelivery,
                    1000
                );

            }

        };


    recorder.start();

}


// =====================================
// STOP UMPIRE
// =====================================

function stopUmpire() {

    umpireRunning = false;


    if (
        recorder &&
        recorder.state === "recording"
    ) {

        recorder.stop();

    }


    status.innerText =
        "⏹ AI Umpire stopped.";

}


// =====================================
// DRS
// =====================================

function openDRS() {

    if (!lastBall) {

        status.innerText =
            "No ball available for DRS.";

        return;

    }


    const url =
        URL.createObjectURL(lastBall);


    replay.src = url;


    drsBox.style.display =
        "block";


    status.innerText =
        "🔍 DRS replay ready.";

}


// =====================================
// SLOW MOTION
// =====================================

function slowMotion() {

    replay.playbackRate = 0.25;

    replay.play();

}


// =====================================
// NORMAL SPEED
// =====================================

function normalSpeed() {

    replay.playbackRate = 1;

    replay.play();

}


// =====================================
// FRAME BACK
// =====================================

function backFrame() {

    replay.pause();

    replay.currentTime =
        Math.max(
            0,
            replay.currentTime - 0.05
        );

}


// =====================================
// FRAME FORWARD
// =====================================

function forwardFrame() {

    replay.pause();

    replay.currentTime += 0.05;

}

</script>

</body>
</html>
