<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mukul's Gully DRS 🏏</title>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>

<!-- COCO-SSD object detection -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    background: #151515;
    padding: 18px;
    font-size: 26px;
    font-weight: bold;
}

#cameraBox {
    position: relative;
    width: 96%;
    max-width: 750px;
    margin: 15px auto;
    overflow: hidden;
    border-radius: 15px;
    background: black;
}

#camera {
    width: 100%;
    display: block;
}

#wicket {
    position: absolute;
    border: 4px solid red;
    display: none;
    pointer-events: none;
}

.wideLine {
    position: absolute;
    top: 0;
    width: 4px;
    height: 100%;
    background: yellow;
    display: none;
    pointer-events: none;
}

#ballMarker {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 3px solid white;
    background: red;
    display: none;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 17px;
    margin: 5px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.blue {
    background: #1976d2;
    color: white;
}

.red {
    background: #e53935;
    color: white;
}

.yellow {
    background: #e5b800;
    color: black;
}

.green {
    background: #16a34a;
    color: white;
}

.purple {
    background: #7e57c2;
    color: white;
}

.gray {
    background: #555;
    color: white;
}

#status {
    width: 94%;
    max-width: 700px;
    margin: 12px auto;
    padding: 13px;
    background: #181818;
    border-radius: 10px;
}

#decision {
    font-size: 30px;
    font-weight: bold;
    margin: 15px;
}

#confidence {
    color: #aaa;
    margin-bottom: 10px;
}

#drsBox {
    display: none;
    width: 94%;
    max-width: 700px;
    margin: 15px auto;
    padding: 15px;
    background: #181818;
    border-radius: 15px;
}

#replay {
    width: 100%;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>🏏 GULLY DRS</header>

<div id="cameraBox">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <div id="wicket"></div>

    <div
        id="leftWide"
        class="wideLine">
    </div>

    <div
        id="rightWide"
        class="wideLine">
    </div>

    <div id="ballMarker"></div>

</div>

<div>

    <button class="blue" onclick="startCamera()">
        📷 Start Camera
    </button>

    <button class="red" onclick="setWicket()">
        🟥 Set Wicket
    </button>

    <button class="yellow" onclick="setWideLines()">
        🟡 Set Wide Lines
    </button>

    <br>

    <button class="green" onclick="startUmpire()">
        ▶️ START UMPIRE
    </button>

    <button class="gray" onclick="stopUmpire()">
        ⏹ STOP
    </button>

    <button class="purple" onclick="openDRS()">
        🔍 DRS
    </button>

</div>

<div id="status">
    Loading computer vision...
</div>

<div id="decision">
    —
</div>

<div id="confidence"></div>

<div id="drsBox">

    <h2>🔍 DRS REPLAY</h2>

    <video id="replay" controls></video>

    <br>

    <button class="purple" onclick="slowMotion()">
        🐢 Slow
    </button>

    <button class="blue" onclick="normalSpeed()">
        ▶ Normal
    </button>

    <button class="gray" onclick="backFrame()">
        ⏪
    </button>

    <button class="gray" onclick="forwardFrame()">
        ⏩
    </button>

</div>


<script>

const camera =
    document.getElementById("camera");

const cameraBox =
    document.getElementById("cameraBox");

const wicket =
    document.getElementById("wicket");

const leftWide =
    document.getElementById("leftWide");

const rightWide =
    document.getElementById("rightWide");

const ballMarker =
    document.getElementById("ballMarker");

const status =
    document.getElementById("status");

const decision =
    document.getElementById("decision");

const confidence =
    document.getElementById("confidence");

const replay =
    document.getElementById("replay");

const drsBox =
    document.getElementById("drsBox");


let stream = null;
let model = null;

let umpireRunning = false;

let settingWicket = false;
let settingWide = false;

let wicketFirstPoint = null;
let wideFirstPoint = null;

let leftWideX = null;
let rightWideX = null;

let recorder = null;
let chunks = [];
let lastBall = null;

let detectionBusy = false;


/* =====================================
   LOAD COMPUTER VISION
===================================== */

async function loadVision() {

    try {

        status.innerText =
            "🤖 Loading computer vision...";

        await tf.ready();

        model =
            await cocoSsd.load();

        status.innerText =
            "🤖 Computer vision ready!";

    }

    catch(error) {

        console.error(error);

        status.innerText =
            "❌ Computer vision failed to load.";

    }
}

loadVision();


/* =====================================
   CAMERA
===================================== */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "environment",
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    }
                },

                audio: false

            });

        camera.srcObject = stream;

        status.innerText =
            "📷 Camera ready. Set your wicket.";

    }

    catch(error) {

        status.innerText =
            "❌ Camera permission denied.";

    }
}


/* =====================================
   SET WICKET
===================================== */

function setWicket() {

    if (!stream) {

        status.innerText =
            "Start the camera first.";

        return;
    }

    settingWicket = true;
    wicketFirstPoint = null;

    status.innerText =
        "Tap TOP-LEFT of the wall wicket.";

}


/* =====================================
   SET WIDE LINES
===================================== */

function setWideLines() {

    if (wicket.style.display !== "block") {

        status.innerText =
            "Set the wicket first.";

        return;
    }

    settingWide = true;
    wideFirstPoint = null;

    status.innerText =
        "Tap the LEFT wide line.";

}


/* =====================================
   CAMERA CLICK
===================================== */

cameraBox.addEventListener(
    "click",
    function(event) {

        const rect =
            cameraBox.getBoundingClientRect();

        const x =
            event.clientX - rect.left;

        const y =
            event.clientY - rect.top;


        /* WICKET */

        if (settingWicket) {

            if (!wicketFirstPoint) {

                wicketFirstPoint = {
                    x: x,
                    y: y
                };

                status.innerText =
                    "Tap BOTTOM-RIGHT of wicket.";

                return;
            }

            const left =
                Math.min(
                    wicketFirstPoint.x,
                    x
                );

            const top =
                Math.min(
                    wicketFirstPoint.y,
                    y
                );

            const width =
                Math.abs(
                    x - wicketFirstPoint.x
                );

            const height =
                Math.abs(
                    y - wicketFirstPoint.y
                );


            wicket.style.left =
                left + "px";

            wicket.style.top =
                top + "px";

            wicket.style.width =
                width + "px";

            wicket.style.height =
                height + "px";

            wicket.style.display =
                "block";


            wicketFirstPoint = null;
            settingWicket = false;

            status.innerText =
                "🟥 Wicket saved. Set wide lines.";

            return;
        }


        /* WIDE LINES */

        if (settingWide) {

            if (wideFirstPoint === null) {

                wideFirstPoint = x;

                leftWideX = x;

                leftWide.style.left =
                    x + "px";

                leftWide.style.display =
                    "block";

                status.innerText =
                    "Now tap the RIGHT wide line.";

                return;
            }


            rightWideX = x;

            rightWide.style.left =
                x + "px";

            rightWide.style.display =
                "block";


            wideFirstPoint = null;
            settingWide = false;

            status.innerText =
                "🟡 Wide lines saved. Press START UMPIRE.";

        }

    }
);


/* =====================================
   START UMPIRE
===================================== */

function startUmpire() {

    if (!model) {

        status.innerText =
            "🤖 Computer vision is still loading.";

        return;
    }

    if (!stream) {

        status.innerText =
            "Start the camera first.";

        return;
    }

    if (wicket.style.display !== "block") {

        status.innerText =
            "Set the wicket first.";

        return;
    }

    if (
        leftWideX === null ||
        rightWideX === null
    ) {

        status.innerText =
            "Set both wide lines first.";

        return;
    }


    umpireRunning = true;

    decision.innerText =
        "🤖 WATCHING";

    status.innerText =
        "🟢 AI UMPIRE ACTIVE";

    startRecording();

    detectBall();

}


/* =====================================
   RECORD
===================================== */

function startRecording() {

    if (!stream) return;

    chunks = [];

    recorder =
        new MediaRecorder(stream);


    recorder.ondataavailable =
        function(event) {

            if (event.data.size > 0) {

                chunks.push(event.data);

            }

        };


    recorder.onstop =
        function() {

            lastBall =
                new Blob(
                    chunks,
                    {
                        type: "video/webm"
                    }
                );

        };


    recorder.start();

}


/* =====================================
   COMPUTER VISION
===================================== */

async function detectBall() {

    if (!umpireRunning || !model)
        return;

    if (detectionBusy) {

        requestAnimationFrame(detectBall);

        return;
    }

    detectionBusy = true;


    try {

        const predictions =
            await model.detect(camera);


        /*
         * COCO-SSD has a "sports ball"
         * category.
         */

        const balls =
            predictions.filter(
                p =>
                    p.class === "sports ball" &&
                    p.score > 0.25
            );


        if (balls.length > 0) {

            /*
             * Pick the most confident
             * sports-ball detection.
             */

            balls.sort(
                (a,b) =>
                    b.score - a.score
            );


            const ball =
                balls[0];


            const [x,y,width,height] =
                ball.bbox;


            const centerX =
                x + width / 2;

            const centerY =
                y + height / 2;


            /*
             * Convert camera coordinates
             * to displayed camera coordinates.
             */

            const scaleX =
                cameraBox.clientWidth /
                camera.videoWidth;

            const scaleY =
                cameraBox.clientHeight /
                camera.videoHeight;


            const displayX =
                centerX * scaleX;

            const displayY =
                centerY * scaleY;


            ballMarker.style.left =
                displayX + "px";

            ballMarker.style.top =
                displayY + "px";

            ballMarker.style.display =
                "block";


            confidence.innerText =
                "Ball confidence: " +
                Math.round(ball.score * 100) +
                "%";


            /*
             * WIDE TEST
             *
             * For this first prototype,
             * we compare the ball's horizontal
             * position with the two lines.
             */

            const minX =
                Math.min(
                    leftWideX,
                    rightWideX
                );

            const maxX =
                Math.max(
                    leftWideX,
                    rightWideX
                );


            if (
                displayX < minX ||
                displayX > maxX
            ) {

                decision.innerText =
                    "🟡 WIDE";

            }

            else {

                decision.innerText =
                    "🟢 LEGAL";

            }

        }

        else {

            ballMarker.style.display =
                "none";

            decision.innerText =
                "👀 SEARCHING";

            confidence.innerText =
                "";

        }

    }

    catch(error) {

        console.error(error);

    }


    detectionBusy = false;


    if (umpireRunning) {

        requestAnimationFrame(
            detectBall
        );

    }

}


/* =====================================
   STOP
===================================== */

function stopUmpire() {

    umpireRunning = false;

    if (
        recorder &&
        recorder.state === "recording"
    ) {

        recorder.stop();

    }

    ballMarker.style.display =
        "none";

    decision.innerText =
        "⏹ STOPPED";

    status.innerText =
        "AI Umpire stopped.";

}


/* =====================================
   DRS
===================================== */

function openDRS() {

    if (!lastBall) {

        status.innerText =
            "No recording available yet.";

        return;
    }


    const url =
        URL.createObjectURL(lastBall);

    replay.src = url;

    drsBox.style.display =
        "block";

    status.innerText =
        "🔍 DRS replay ready.";

}


/* =====================================
   REPLAY
===================================== */

function slowMotion() {

    replay.playbackRate = 0.25;
    replay.play();

}

function normalSpeed() {

    replay.playbackRate = 1;
    replay.play();

}

function backFrame() {

    replay.pause();

    replay.currentTime =
        Math.max(
            0,
            replay.currentTime - 0.05
        );

}

function forwardFrame() {

    replay.pause();

    replay.currentTime += 0.05;

}

</script>

</body>
</html>
