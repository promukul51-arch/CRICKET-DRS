<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gully DRS 🏏</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 18px;
    font-size: 25px;
    font-weight: bold;
    background: #151515;
}

#cameraBox {
    position: relative;
    width: 96%;
    max-width: 700px;
    margin: 15px auto;
    overflow: hidden;
    border-radius: 15px;
    background: black;
}

video {
    width: 100%;
    display: block;
}

#wicket {
    position: absolute;
    border: 4px solid red;
    display: none;
    pointer-events: none;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
}

#start {
    background: #19a463;
    color: white;
}

#setup {
    background: #e53935;
    color: white;
}

#drs {
    background: #7e57c2;
    color: white;
}

#status {
    margin: 12px auto;
    max-width: 700px;
    padding: 13px;
    background: #181818;
    border-radius: 10px;
}

#decision {
    font-size: 28px;
    font-weight: bold;
    margin: 15px;
}

#drsBox {
    display: none;
    max-width: 700px;
    margin: 15px auto;
    background: #181818;
    padding: 15px;
    border-radius: 15px;
}

#replay {
    width: 100%;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>🏏 GULLY DRS</header>

<div id="cameraBox">
    <video id="camera" autoplay muted playsinline></video>
    <div id="wicket"></div>
</div>

<div>

    <button id="start" onclick="startCamera()">
        📷 Start Camera
    </button>

    <button id="setup" onclick="setupWicket()">
        🟥 Set Wicket
    </button>

    <button id="drs" onclick="openDRS()">
        🔍 DRS
    </button>

</div>

<div id="status">
    Start the camera first.
</div>

<div id="decision">
    —
</div>

<div id="drsBox">

    <h2>🔍 DRS REPLAY</h2>

    <video id="replay" controls></video>

    <br><br>

    <button onclick="slowMotion()">
        🐢 Slow
    </button>

    <button onclick="normalSpeed()">
        ▶ Normal
    </button>

    <button onclick="backFrame()">
        ⏪
    </button>

    <button onclick="forwardFrame()">
        ⏩
    </button>

</div>


<script>

const camera = document.getElementById("camera");
const cameraBox = document.getElementById("cameraBox");
const wicket = document.getElementById("wicket");
const status = document.getElementById("status");
const decision = document.getElementById("decision");
const replayBox = document.getElementById("drsBox");
const replay = document.getElementById("replay");

let stream = null;
let recorder = null;
let chunks = [];
let lastBall = null;

let settingWicket = false;


// ---------------- CAMERA ----------------

async function startCamera() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            },
            audio: false
        });

        camera.srcObject = stream;

        status.innerText =
            "Camera ready. Set your wall wicket.";

    } catch (error) {

        status.innerText =
            "❌ Camera permission was denied.";

    }
}


// ---------------- WICKET SETUP ----------------

function setupWicket() {

    if (!stream) {
        status.innerText = "Start the camera first.";
        return;
    }

    settingWicket = true;

    status.innerText =
        "Tap the TOP-LEFT corner of your wall wicket.";

}


// First click = top-left
// Second click = bottom-right

let firstPoint = null;

cameraBox.addEventListener("click", function(event) {

    if (!settingWicket) return;

    const rect = cameraBox.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    if (!firstPoint) {

        firstPoint = {
            x: x,
            y: y
        };

        status.innerText =
            "Now tap the BOTTOM-RIGHT corner of the wicket.";

        return;
    }

    const width = x - firstPoint.x;
    const height = y - firstPoint.y;

    wicket.style.left = firstPoint.x + "px";
    wicket.style.top = firstPoint.y + "px";

    wicket.style.width = Math.abs(width) + "px";
    wicket.style.height = Math.abs(height) + "px";

    wicket.style.display = "block";

    firstPoint = null;
    settingWicket = false;

    status.innerText =
        "✅ Wicket saved. Press START to begin.";

});


// ---------------- RECORDING ----------------

function startRecording() {

    if (!stream) {
        status.innerText = "Start the camera first.";
        return;
    }

    chunks = [];

    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = function(event) {

        if (event.data.size > 0) {
            chunks.push(event.data);
        }

    };

    recorder.onstop = function() {

        lastBall = new Blob(chunks, {
            type: "video/webm"
        });

        status.innerText =
            "🏏 Delivery saved. Press DRS if needed.";

    };

    recorder.start();

    status.innerText =
        "🔴 Recording delivery...";

}


// ---------------- DRS ----------------

function openDRS() {

    if (!lastBall) {

        status.innerText =
            "No delivery recorded yet.";

        return;
    }

    const url = URL.createObjectURL(lastBall);

    replay.src = url;

    replayBox.style.display = "block";

    status.innerText =
        "🔍 DRS ready.";

}


// ---------------- REPLAY ----------------

function slowMotion() {

    replay.playbackRate = 0.25;
    replay.play();

}

function normalSpeed() {

    replay.playbackRate = 1;
    replay.play();

}

function backFrame() {

    replay.pause();

    replay.currentTime =
        Math.max(0, replay.currentTime - 0.05);

}

function forwardFrame() {

    replay.pause();

    replay.currentTime += 0.05;

}


// ---------------- TEMPORARY AI ----------------

// This is deliberately simple for Version 2.
// Actual ball detection will be added later.

function showLegal() {

    decision.innerText = "🟢 LEGAL";

}

function showWide() {

    decision.innerText = "🟡 WIDE";

}


// Automatically show a temporary result
// while we build the real computer vision.

setInterval(function() {

    if (stream && !settingWicket) {

        showLegal();

    }

}, 2000);

</script>

</body>
</html>
